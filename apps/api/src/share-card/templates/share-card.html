<html>
  <body style="
    margin:0;
    width:1080px;
    height:1080px;
    background:#000;
    color:#00fff2;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:60px;
  ">
    <div>
      <h1 style="font-size:48px;">PINOY RUNNER EXTREME</h1>
      <p style="font-size:24px;">MISSION LOG</p>
    </div>

    <img src="{{mapUrl}}" style="width:100%; border-radius:20px;" />

    <div style="display:flex; justify-content:space-between;">
      <div>
        <p>DIST</p>
        <h2>{{distance}} KM</h2>
      </div>
      <div>
        <p>TIME</p>
        <h2>{{time}}</h2>
      </div>
      <div>
        <p>PACE</p>
        <h2>{{pace}}</h2>
      </div>
    </div>
  </body>
</html>
